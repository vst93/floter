[package]
name = "floter"
version = "0.3.3-preview"
description = "A floating terminal application"
license = "GPL-3.0"
authors = ["you"]
edition = "2021"
default-run = "floter"

[lib]
name = "floter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
shlex = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
tokio = { version = "1", features = ["full"] }
alacritty_terminal = "0.26"
parking_lot = "0.12"
base64 = "0.22"
ed25519-dalek = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
crossterm = "0.28"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
semver = { version = "1.0.28", features = ["serde"] }
sha2 = "0.10.9"
tar = "0.4.46"
flate2 = "1.1.9"
jsonschema = { version = "0.33", default-features = false }
# qscreen owns the persistent PTY while Floter remains responsible for input
# encoding and rendering. Pin the audited revision: these crates are not yet
# published on crates.io and following main would make the wire protocol
# nondeterministic between releases.
qscreen-daemon = { path = "vendor/qscreen-daemon" }
qscreen-protocol = { git = "https://github.com/dualface/qscreen.git", rev = "3783e78b47875c7714e4b85a2e0c806b27c75a6a" }
qscreen-shared = { path = "vendor/qscreen-shared" }
# Pinyin initials for the launcher: a Chinese application name is unreachable
# from a Latin keyboard otherwise, and typing the initials is how it is searched
# for everywhere else on the system.
#
# `first_letter` is the only thing needed, and it lives behind `plain` — the
# default feature set also compiles the tone-marked and numbered-tone tables,
# which is a static table per style that nothing here would ever read.
pinyin = { version = "0.11", default-features = false, features = ["plain"] }

# A launcher needs NSPanel's non-activating semantics to appear inside another
# app's fullscreen Space without switching away from it. The plugin subclasses
# Tauri's existing NSWindow in place, so the WebView and Tauri window handle stay
# intact. Pin the revision so builds do not follow changes on the v2.1 branch.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
plist = "1"
libc = "0.2"

# DWM corner-radius control on Windows 11. `DwmSetWindowAttribute` with
# `DWM_WINDOW_CORNER_PREFERENCE` lets us turn off the system's rounded
# corners so the CSS `border-radius` is the only one painting — a mismatch
# between the two leaves a visible seam at the window edge.
#
# The other Windows features cover Alt+Space message subclassing, native
# borderless-window dragging, and the per-user Run registry value.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
