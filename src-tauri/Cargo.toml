[package]
name = "floter"
version = "0.1.0"
description = "A floating terminal application"
authors = ["you"]
edition = "2021"

[lib]
name = "floter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["full"] }
alacritty_terminal = "0.26"
parking_lot = "0.12"
base64 = "0.22"

# Raw `NSWindow` access, for the one window property Tauri does not expose: the
# window level. `set_always_on_top` is fixed at NSFloatingWindowLevel, which is
# not high enough to clear a fullscreen app — see `raise_window_level`.
#
# Not a new crate in the tree: tao already builds this exact version, and the
# feature set below is a subset of the one it asks for, so cargo's feature
# unification leaves the build unchanged. `default-features = false` keeps it
# that way — the default set is all of AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSResponder",
  "NSWindow",
] }
