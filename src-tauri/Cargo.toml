[package]
name = "floter"
version = "0.1.0"
description = "A floating terminal application"
authors = ["you"]
edition = "2021"

[lib]
name = "floter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["full"] }
alacritty_terminal = "0.26"
parking_lot = "0.12"
base64 = "0.22"
# Pinyin initials for the launcher: a Chinese application name is unreachable
# from a Latin keyboard otherwise, and typing the initials is how it is searched
# for everywhere else on the system.
#
# `first_letter` is the only thing needed, and it lives behind `plain` — the
# default feature set also compiles the tone-marked and numbered-tone tables,
# which is a static table per style that nothing here would ever read.
pinyin = { version = "0.11", default-features = false, features = ["plain"] }

# Raw `NSWindow`/`NSApplication` access, for the two things Tauri does not
# expose: the window level, and activating an accessory application in place.
# `set_always_on_top` is fixed at NSFloatingWindowLevel, which is not high
# enough to clear a fullscreen app, and `set_focus` is a no-op against a window
# the window server has not mapped yet — see `raise_window_level` and
# `force_activate`.
#
# Not new crates in the tree: tao already builds these exact versions, and the
# feature set below is a subset of the one it asks for, so cargo's feature
# unification leaves the build unchanged. `default-features = false` keeps it
# that way — the default set is all of AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSResponder",
  "NSWindow",
] }

# DWM corner-radius control on Windows 11. `DwmSetWindowAttribute` with
# `DWM_WINDOW_CORNER_PREFERENCE` lets us turn off the system's rounded
# corners so the CSS `border-radius` is the only one painting — a mismatch
# between the two leaves a visible seam at the window edge.
#
# `Win32_Graphics_Dwm` is the only feature needed; it pulls in the FFI
# bindings for `DwmSetWindowAttribute` and the corner-preference constants.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
] }
