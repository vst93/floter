[package]
name = "floter"
version = "0.2.0"
description = "A floating terminal application"
license = "GPL-3.0"
authors = ["you"]
edition = "2021"

[lib]
name = "floter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["full"] }
alacritty_terminal = "0.26"
parking_lot = "0.12"
base64 = "0.22"
# Pinyin initials for the launcher: a Chinese application name is unreachable
# from a Latin keyboard otherwise, and typing the initials is how it is searched
# for everywhere else on the system.
#
# `first_letter` is the only thing needed, and it lives behind `plain` — the
# default feature set also compiles the tone-marked and numbered-tone tables,
# which is a static table per style that nothing here would ever read.
pinyin = { version = "0.11", default-features = false, features = ["plain"] }

# A launcher needs NSPanel's non-activating semantics to appear inside another
# app's fullscreen Space without switching away from it. The plugin subclasses
# Tauri's existing NSWindow in place, so the WebView and Tauri window handle stay
# intact. Pin the revision so builds do not follow changes on the v2.1 branch.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
plist = "1"
libc = "0.2"

# DWM corner-radius control on Windows 11. `DwmSetWindowAttribute` with
# `DWM_WINDOW_CORNER_PREFERENCE` lets us turn off the system's rounded
# corners so the CSS `border-radius` is the only one painting — a mismatch
# between the two leaves a visible seam at the window edge.
#
# `Win32_Graphics_Dwm` is the only feature needed; it pulls in the FFI
# bindings for `DwmSetWindowAttribute` and the corner-preference constants.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Registry",
] }
