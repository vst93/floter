# Manual diagnostic job: starts the Windows build on a real runner, screenshots
# the desktop, and uploads the capture. This is deliberately NOT part of the
# release chain -- release.yml must never call it, and it only runs on
# workflow_dispatch. The screenshot is the deliverable: mainline reviews it
# visually (card fill, corner shape, material traces) because R156/R157's
# runtime behaviour had no Windows evidence beyond user retests.
name: windows-smoke
on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the frontend
        run: npm ci && npm run build

      - name: Build the app (exe only, no installer)
        run: cargo build --release
        working-directory: src-tauri

      - name: Launch, reveal, and capture the desktop
        shell: pwsh
        run: |
          $exe = "src-tauri\target\release\floter.exe"
          if (-not (Test-Path $exe)) { $exe = "src-tauri\target\release\floter.exe".Replace("floter", (Get-ChildItem "src-tauri\target\release" -Filter *.exe | Where-Object { $_.Name -notmatch "\.d$|build-|floter-build" } | Select-Object -First 1).Name) }
          Write-Host "launching $exe"
          Start-Process -FilePath $exe -ArgumentList "open"
          Start-Sleep -Seconds 25

          $proc = Get-Process | Where-Object { $_.Path -like "*target\release*" }
          if (-not $proc) { throw "the app process is not alive at screenshot time" }

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$env:GITHUB_WORKSPACE\smoke-desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()
          Write-Host "captured $($bounds.Width)x$($bounds.Height)"

      - name: Stop the app
        if: always()
        shell: pwsh
        run: Get-Process | Where-Object { $_.Path -like "*target\release*" } | Stop-Process -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-desktop
          path: smoke-desktop.png
          if-no-files-found: error
