name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0). Leave empty to bump patch from current.'
        required: false
        default: ''
      notes:
        description: 'Release notes. Leave empty to auto-generate from commits.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ── Determine version, update files, create tag, create release ──────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          CURRENT=$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          else
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT -> New: $VERSION"

      - name: Update version in files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "0,/\"version\": \".*\"/s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "0,/^version = \".*\"/s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Generate release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s" --no-merges)
            else
              COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
            fi
            NOTES=$(printf '## Changes\n\n%s\n\n---\n\n## Install\n\nDownload the file for your platform:\n\n| File | Platform |\n|------|----------|\n| `*-macos-apple-silicon.dmg` | macOS (M1/M2/M3/M4) |\n| `*-macos-intel.dmg` | macOS (Intel) |\n| `*-linux-x86_64.deb` | Linux (x86_64) |\n| `*-linux-arm64.deb` | Linux (ARM64) |\n| `*-windows-x86_64-setup.exe` | Windows (x86_64) |\n| `*-windows-arm64-setup.exe` | Windows (ARM64) |\n' "$COMMITS")
          fi
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit (already at $VERSION)"
          else
            git commit -m "release: v$VERSION"
          fi
          git tag "v$VERSION"
          git push origin main
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="${{ steps.notes.outputs.notes }}"
          # Decode the percent-encoded notes back to real newlines
          NOTES=$(printf '%b' "${NOTES//%/\\x}")
          gh release create "v$VERSION" \
            --title "floter v$VERSION" \
            --notes "$NOTES" \
            --verify-tag

  # ── Build for each platform ──────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-apple-silicon
          - os: macos-14
            target: x86_64-apple-darwin
            label: macos-intel
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Build only — no tagName so tauri-action does NOT auto-upload.
      # We rename and upload ourselves in the next step to control file names.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      # DMG bundling on macOS can fail intermittently on GitHub runners.
      # Retry once without DMG so at least the .app.tar.gz ships.
      - name: Retry without DMG (macOS only)
        if: failure() && runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }} --bundles app

      # ── Rename artifacts with clear platform names ────────────────────────
      # Only upload ONE file per platform (the installer), not the raw
      # Tauri names. Users should see:
      #   floter-0.1.0-macos-apple-silicon.dmg
      #   floter-0.1.0-linux-x86_64.deb
      #   floter-0.1.0-windows-x86_64-setup.exe
      # etc. No duplicates.
      - name: Collect and rename artifacts (Unix)
        if: runner.os != 'Windows' && success() || runner.os != 'Windows'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          LABEL="${{ matrix.label }}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p renamed

          # .dmg (macOS — preferred installer)
          found_dmg=$(find "$BUNDLE_DIR" -name "*.dmg" -type f | head -1)
          if [ -n "$found_dmg" ]; then
            cp "$found_dmg" "renamed/floter-${VERSION}-${LABEL}.dmg"
          fi

          # .deb (Linux — preferred installer)
          found_deb=$(find "$BUNDLE_DIR" -name "*.deb" -type f | head -1)
          if [ -n "$found_deb" ]; then
            cp "$found_deb" "renamed/floter-${VERSION}-${LABEL}.deb"
          fi

          # .rpm (Linux — secondary)
          found_rpm=$(find "$BUNDLE_DIR" -name "*.rpm" -type f | head -1)
          if [ -n "$found_rpm" ]; then
            cp "$found_rpm" "renamed/floter-${VERSION}-${LABEL}.rpm"
          fi

          # .AppImage (Linux — secondary)
          found_appimage=$(find "$BUNDLE_DIR" -name "*.AppImage" -type f | head -1)
          if [ -n "$found_appimage" ]; then
            cp "$found_appimage" "renamed/floter-${VERSION}-${LABEL}.AppImage"
          fi

          # .app.tar.gz (macOS — for updater, only if no DMG)
          if [ -z "$found_dmg" ]; then
            found_targz=$(find "$BUNDLE_DIR" -name "*.app.tar.gz" -type f | head -1)
            if [ -n "$found_targz" ]; then
              cp "$found_targz" "renamed/floter-${VERSION}-${LABEL}.app.tar.gz"
            fi
          fi

          echo "=== Renamed files ==="
          ls -la renamed/

      - name: Collect and rename artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          $LABEL = "${{ matrix.label }}"
          $BUNDLE_DIR = "src-tauri/target/${{ matrix.target }}/release/bundle"
          New-Item -ItemType Directory -Force -Path renamed

          # .exe (NSIS installer — preferred)
          $exe = Get-ChildItem -Path $BUNDLE_DIR -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path $BUNDLE_DIR -Recurse -Filter "*.exe" | Select-Object -First 1
          }
          if ($exe) {
            Copy-Item $exe.FullName "renamed/floter-$VERSION-$LABEL-setup.exe"
          }

          echo "=== Renamed files ==="
          Get-ChildItem renamed/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: renamed/*
          fail_on_unmatched_files: true
