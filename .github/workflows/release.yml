name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0). Leave empty to bump patch from current.'
        required: false
        default: ''
      notes:
        description: 'Release notes. Leave empty to auto-generate from commits.'
        required: false
        default: ''
      branch:
        description: 'Branch to release from (default: main)'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  # ── Determine version and publish the version commit ─────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          CURRENT=$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            BASE_CURRENT="${CURRENT%%[-+]*}"
            MAJOR=$(echo "$BASE_CURRENT" | cut -d. -f1)
            MINOR=$(echo "$BASE_CURRENT" | cut -d. -f2)
            PATCH=$(echo "$BASE_CURRENT" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT -> New: $VERSION"

      - name: Update version in files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "0,/\"version\": \".*\"/s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "0,/\"version\": \".*\"/s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package-lock.json
          sed -i "0,/      \"version\": \".*\"/s/      \"version\": \".*\"/      \"version\": \"$VERSION\"/" package-lock.json
          sed -i "0,/^version = \".*\"/s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          # Update floter's version in Cargo.lock (find "name = floter" line, replace next line's version)
          LOCK_LINE=$(grep -n '^name = "floter"$' src-tauri/Cargo.lock | head -1 | cut -d: -f1)
          if [ -n "$LOCK_LINE" ]; then
            NEXT=$((LOCK_LINE + 1))
            sed -i "${NEXT}s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.lock
          fi
          # The Arch package downloads the release artifacts of its own pkgver,
          # so a stale one here points at a version that no longer exists.
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD

      - name: Generate release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s" --no-merges)
            else
              COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
            fi
            NOTES=$(printf '## Changes\n\n%s\n\n---\n\n## Install\n\nDownload the file for your platform:\n\n| File | Platform |\n|------|----------|\n| `*-macos-apple-silicon.dmg` | macOS (M1/M2/M3/M4) |\n| `*-macos-intel.dmg` | macOS (Intel) |\n| `*-linux-x86_64.deb` | Linux (x86_64) |\n| `*-linux-arm64.deb` | Linux (ARM64) |\n| `*-windows-x86_64-setup.exe` | Windows (x86_64) |\n| `*-windows-arm64-setup.exe` | Windows (ARM64) |\n\n> **macOS note:** This app is not code-signed with an Apple Developer certificate, so macOS reports it as damaged. Run this in Terminal to fix:\n>\n> ```\n> xattr -cr /Applications/floter.app\n> ```\n' "$COMMITS")
          fi
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Commit version
        id: commit
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${BRANCH:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit (already at $VERSION)"
          else
            git commit -m "release: v$VERSION"
          fi
          git push origin "$BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Build for each platform ──────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-apple-silicon
          - os: macos-14
            target: x86_64-apple-darwin
            label: macos-intel
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Build only — no tagName so tauri-action does NOT auto-upload.
      # We rename and upload ourselves in the next step to control file names.
      - name: Build Tauri app
        id: tauri-build
        continue-on-error: ${{ runner.os == 'macOS' }}
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}

      # DMG bundling on macOS can fail intermittently on GitHub runners.
      # Retry once without DMG so at least the .app.tar.gz ships.
      - name: Retry without DMG (macOS only)
        if: runner.os == 'macOS' && steps.tauri-build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles app

      # ── Rename artifacts with clear platform names ────────────────────────
      # Only upload ONE file per platform (the installer), not the raw
      # Tauri names. Users should see:
      #   floter-0.1.0-macos-apple-silicon.dmg
      #   floter-0.1.0-linux-x86_64.deb
      #   floter-0.1.0-windows-x86_64-setup.exe
      # etc. No duplicates.
      - name: Collect and rename artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          LABEL="${{ matrix.label }}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p renamed

          # .dmg (macOS — preferred installer)
          found_dmg=$(find "$BUNDLE_DIR" -name "*.dmg" -type f | head -1)
          if [ -n "$found_dmg" ]; then
            cp "$found_dmg" "renamed/floter-${VERSION}-${LABEL}.dmg"
          fi

          # .deb (Linux — preferred installer)
          found_deb=$(find "$BUNDLE_DIR" -name "*.deb" -type f | head -1)
          if [ -n "$found_deb" ]; then
            cp "$found_deb" "renamed/floter-${VERSION}-${LABEL}.deb"
          fi

          # .rpm (Linux — secondary)
          found_rpm=$(find "$BUNDLE_DIR" -name "*.rpm" -type f | head -1)
          if [ -n "$found_rpm" ]; then
            cp "$found_rpm" "renamed/floter-${VERSION}-${LABEL}.rpm"
          fi

          # .AppImage (Linux — secondary)
          found_appimage=$(find "$BUNDLE_DIR" -name "*.AppImage" -type f | head -1)
          if [ -n "$found_appimage" ]; then
            cp "$found_appimage" "renamed/floter-${VERSION}-${LABEL}.AppImage"
          fi

          # .app.tar.gz (macOS — for updater, always upload)
          found_targz=$(find "$BUNDLE_DIR" -name "*.app.tar.gz" -type f | head -1)
          if [ -n "$found_targz" ]; then
            cp "$found_targz" "renamed/floter-${VERSION}-${LABEL}.app.tar.gz"
          fi

          # .app.tar.gz.sig (macOS — updater signature)
          found_targz_sig=$(find "$BUNDLE_DIR" -name "*.app.tar.gz.sig" -type f | head -1)
          if [ -n "$found_targz_sig" ]; then
            cp "$found_targz_sig" "renamed/floter-${VERSION}-${LABEL}.app.tar.gz.sig"
          fi

          # .AppImage.sig (Linux — updater signature)
          found_appimage_sig=$(find "$BUNDLE_DIR" -name "*.AppImage.sig" -type f | head -1)
          if [ -n "$found_appimage_sig" ]; then
            cp "$found_appimage_sig" "renamed/floter-${VERSION}-${LABEL}.AppImage.sig"
          fi

          echo "=== Renamed files ==="
          ls -la renamed/

      - name: Collect and rename artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          $LABEL = "${{ matrix.label }}"
          $BUNDLE_DIR = "src-tauri/target/${{ matrix.target }}/release/bundle"
          New-Item -ItemType Directory -Force -Path renamed

          # .exe (NSIS installer — preferred)
          $exe = Get-ChildItem -Path $BUNDLE_DIR -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path $BUNDLE_DIR -Recurse -Filter "*.exe" | Select-Object -First 1
          }
          if ($exe) {
            Copy-Item $exe.FullName "renamed/floter-$VERSION-$LABEL-setup.exe"
          }

          # .exe.sig (Windows — updater signature)
          $exeSig = Get-ChildItem -Path $BUNDLE_DIR -Recurse -Filter "*-setup.exe.sig" | Select-Object -First 1
          if (-not $exeSig) {
            $exeSig = Get-ChildItem -Path $BUNDLE_DIR -Recurse -Filter "*.exe.sig" | Select-Object -First 1
          }
          if ($exeSig) {
            Copy-Item $exeSig.FullName "renamed/floter-$VERSION-$LABEL-setup.exe.sig"
          }

          echo "=== Renamed files ==="
          Get-ChildItem renamed/

      - name: Store build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: renamed/*
          if-no-files-found: error

  # ── Generate latest.json updater manifest ────────────────────────────────
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="v$VERSION"
          REPO="vst93/floter"

          # Read signature contents (each .sig is a single-line base64 string)
          macos_arm_sig=$(tr -d '\n' < "release-assets/floter-${VERSION}-macos-apple-silicon.app.tar.gz.sig")
          macos_x86_sig=$(tr -d '\n' < "release-assets/floter-${VERSION}-macos-intel.app.tar.gz.sig")
          linux_x86_sig=$(tr -d '\n' < "release-assets/floter-${VERSION}-linux-x86_64.AppImage.sig")
          linux_arm_sig=$(tr -d '\n' < "release-assets/floter-${VERSION}-linux-arm64.AppImage.sig")
          win_x86_sig=$(tr -d '\n' < "release-assets/floter-${VERSION}-windows-x86_64-setup.exe.sig")
          win_arm_sig=$(tr -d '\n' < "release-assets/floter-${VERSION}-windows-arm64-setup.exe.sig")
          for signature in "$macos_arm_sig" "$macos_x86_sig" "$linux_x86_sig" "$linux_arm_sig" "$win_x86_sig" "$win_arm_sig"; do
            if [ -z "$signature" ]; then
              echo "Missing or empty updater signature" >&2
              exit 1
            fi
          done

          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Pass signature values to the Python script via environment variables
          export VERSION="${VERSION}"
          export BASE="${BASE}"
          export MACOS_ARM_SIG="${macos_arm_sig}"
          export MACOS_X86_SIG="${macos_x86_sig}"
          export LINUX_X86_SIG="${linux_x86_sig}"
          export LINUX_ARM_SIG="${linux_arm_sig}"
          export WIN_X86_SIG="${win_x86_sig}"
          export WIN_ARM_SIG="${win_arm_sig}"

          # Use python3 to generate valid JSON
          python3 << 'PYEOF'
          import json, datetime, os

          version = os.environ['VERSION']
          base = os.environ['BASE']

          sigs = {
              "darwin-aarch64": os.environ.get('MACOS_ARM_SIG', ''),
              "darwin-x86_64": os.environ.get('MACOS_X86_SIG', ''),
              "linux-x86_64": os.environ.get('LINUX_X86_SIG', ''),
              "linux-aarch64": os.environ.get('LINUX_ARM_SIG', ''),
              "windows-x86_64": os.environ.get('WIN_X86_SIG', ''),
              "windows-aarch64": os.environ.get('WIN_ARM_SIG', ''),
          }
          urls = {
              "darwin-aarch64": f"{base}/floter-{version}-macos-apple-silicon.app.tar.gz",
              "darwin-x86_64": f"{base}/floter-{version}-macos-intel.app.tar.gz",
              "linux-x86_64": f"{base}/floter-{version}-linux-x86_64.AppImage",
              "linux-aarch64": f"{base}/floter-{version}-linux-arm64.AppImage",
              "windows-x86_64": f"{base}/floter-{version}-windows-x86_64-setup.exe",
              "windows-aarch64": f"{base}/floter-{version}-windows-arm64-setup.exe",
          }
          manifest = {
              "version": version,
              "notes": f"floter v{version}",
              "pub_date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  k: {"signature": sigs[k], "url": urls[k]}
                  for k in sigs
              }
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PYEOF

          echo "=== latest.json ==="
          cat latest.json
          python3 -m json.tool latest.json > /dev/null && echo "JSON valid" || echo "JSON INVALID"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VERSION")" = "${{ needs.prepare.outputs.commit }}"
          else
            git tag "v$VERSION" "${{ needs.prepare.outputs.commit }}"
            git push origin "v$VERSION"
          fi
          NOTES=$(printf '%b' "${NOTES//%/\\x}")
          gh release create "v$VERSION" release-assets/* latest.json \
            --title "floter v$VERSION" \
            --notes "$NOTES" \
            --verify-tag
