name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0). Leave empty to bump patch from current.'
        required: false
        default: ''
      notes:
        description: 'Release notes. Leave empty to auto-generate from commits.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ── Determine version, update files, create tag ──────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          CURRENT=$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          else
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT -> New: $VERSION"

      - name: Update version in files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i "0,/\"version\": \".*\"/s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "0,/^version = \".*\"/s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Generate release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$INPUT_NOTES" ]; then
            # User provided notes — use as-is, via env var to avoid shell
            # interpretation of backticks and $ in markdown content.
            NOTES="$INPUT_NOTES"
          else
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s" --no-merges)
            else
              COMMITS=$(git log --pretty=format:"- %s" --no-merges -20)
            fi
            NOTES=$(printf '## Changes\n\n%s\n\n---\n\n## Install\n\nDownload the file for your platform:\n\n| File | Platform |\n|------|----------|\n| `*-macos-apple-silicon.dmg` | macOS (M1/M2/M3/M4) |\n| `*-macos-intel.dmg` | macOS (Intel) |\n| `*-linux-x86_64.deb` | Linux (x86_64) |\n| `*-linux-arm64.deb` | Linux (ARM64) |\n| `*-windows-x86_64-setup.exe` | Windows (x86_64) |\n| `*-windows-arm64-setup.exe` | Windows (ARM64) |\n' "$COMMITS")
          fi
          # Escape for GitHub Actions output
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit (already at $VERSION)"
          else
            git commit -m "release: v$VERSION"
          fi
          git tag "v$VERSION"
          git push origin main
          git push origin "v$VERSION"

  # ── Build for each platform ──────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-apple-silicon
            display: macOS-Apple-Silicon
          - os: macos-13
            target: x86_64-apple-darwin
            label: macos-intel
            display: macOS-Intel
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            display: Linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-arm64
            display: Linux-ARM64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            display: Windows-x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            label: windows-arm64
            display: Windows-ARM64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: floter v${{ needs.prepare.outputs.version }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # DMG bundling on macOS can fail intermittently on GitHub runners
      # (hdiutil attach races, stale detach, etc.). Retry once without the
      # DMG bundle type so at least the .app.tar.gz ships.
      - name: Retry without DMG (macOS only)
        if: failure() && runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: floter v${{ needs.prepare.outputs.version }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles app

      # ── Rename artifacts with clear platform names ────────────────────────
      # Tauri's default names (floter_0.1.0_amd64.deb, floter_0.1.0_x64-setup.exe)
      # don't tell a non-technical user which file to download. Rename them to
      # floter-0.1.0-macos-apple-silicon.dmg etc.
      - name: Rename artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          LABEL="${{ matrix.label }}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p renamed

          # .dmg (macOS)
          for f in "$BUNDLE_DIR"/**/*.dmg; do
            [ -f "$f" ] && cp "$f" "renamed/floter-${VERSION}-${LABEL}.dmg"
          done

          # .deb (Linux)
          for f in "$BUNDLE_DIR"/**/*.deb; do
            [ -f "$f" ] && cp "$f" "renamed/floter-${VERSION}-${LABEL}.deb"
          done

          # .app.tar.gz (macOS, if present)
          for f in "$BUNDLE_DIR"/**/*.app.tar.gz; do
            [ -f "$f" ] && cp "$f" "renamed/floter-${VERSION}-${LABEL}.app.tar.gz"
          done

          ls -la renamed/

      - name: Rename artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          $LABEL = "${{ matrix.label }}"
          $BUNDLE_DIR = "src-tauri/target/${{ matrix.target }}/release/bundle"
          New-Item -ItemType Directory -Force -Path renamed

          # .exe (NSIS installer)
          Get-ChildItem -Path $BUNDLE_DIR -Recurse -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName "renamed/floter-$VERSION-$LABEL-setup.exe"
          }

          # .msi (if present)
          Get-ChildItem -Path $BUNDLE_DIR -Recurse -Filter "*.msi" | ForEach-Object {
            Copy-Item $_.FullName "renamed/floter-$VERSION-$LABEL.msi"
          }

          Get-ChildItem renamed/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          files: renamed/*
          fail_on_unmatched_files: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floter-${{ matrix.label }}
          path: renamed/*
