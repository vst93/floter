name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0). Leave empty to bump patch from current.'
        required: false
        default: ''
      notes:
        description: 'Release notes. Leave empty to auto-generate from commits.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ── Determine version, update files, create tag ──────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          CURRENT=$(grep -oP '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json)
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          else
            # Bump patch: 0.1.0 -> 0.1.1, 1.2.3 -> 1.2.4
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT -> New: $VERSION"

      - name: Update version in files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          # package.json
          sed -i "0,/\"version\": \".*\"/s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          # Cargo.toml
          sed -i "0,/^version = \".*\"/s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Generate release notes
        id: notes
        run: |
          if [ -n "${{ inputs.notes }}" ]; then
            NOTES="${{ inputs.notes }}"
          else
            # Get commits since last tag, or all if no tags
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              NOTES=$(git log "$LAST_TAG..HEAD" --pretty=format:"- %s" --no-merges)
            else
              NOTES=$(git log --pretty=format:"- %s" --no-merges -20)
            fi
          fi
          # Escape for GitHub Actions output
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # The version files may already be at the target version (e.g. first
          # release), so there is nothing to commit — skip the commit step but
          # still create the tag.
          if git diff --cached --quiet; then
            echo "No version changes to commit (already at $VERSION)"
          else
            git commit -m "release: v$VERSION"
          fi
          git tag "v$VERSION"
          git push origin main
          git push origin "v$VERSION"

  # ── Build for each platform ──────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
            artifact: floter_*_aarch64.app.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            label: macOS-Intel
            artifact: floter_*_x86_64.app.tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x86_64
            artifact: floter_*.deb
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            label: Linux-ARM64
            artifact: floter_*.deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x86_64
            artifact: floter_*_x64-setup.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            label: Windows-ARM64
            artifact: floter_*_arm64-setup.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          # ARM64 cross-compilation: install the cross toolchain and set up
          # pkg-config and linker so cargo can target aarch64 from x86_64.
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            # Tauri's build.rs uses pkg-config for system libs; point it at the
            # ARM64 sysroot so it doesn't pick up the host's x86_64 libraries.
            sudo dpkg --add-architecture arm64
            sudo apt-get update
            sudo apt-get install -y libgtk-3-dev:arm64 libwebkit2gtk-4.1-dev:arm64 librsvg2-dev:arm64 libssl-dev:arm64
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_SYSROOT_DIR=/' >> "$GITHUB_ENV"
            echo 'PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig' >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: floter v${{ needs.prepare.outputs.version }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floter-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
