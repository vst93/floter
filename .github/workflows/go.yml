name: Go

on:
  push:
    branches: [mygo-rewrite, main]
  pull_request:
    branches: [mygo-rewrite, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -count=1 ./...

  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/universal
            artifacts: |
              dist/*/*.app
              dist/*/*.dmg
          - name: Linux
            os: ubuntu-latest
            platform: linux/amd64
            artifacts: |
              dist/*/*.deb
              dist/*/*.tar.gz
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            artifacts: |
              dist/*/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The CLI is a tool of the module (go.mod's `tool` directive), so this
      # builds each platform's packages the way a release does: the bundle on
      # macOS, the .deb and the user-installable tarball on Linux, the setup
      # .exe on Windows. The terminal plugin's native library is fetched into
      # the CLI's cache and shipped with the app.
      - name: mygo build
        run: go tool mygo build -platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: floter-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
