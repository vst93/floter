<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floter</title>
  </head>
  <body>
    <!--
      The clipboard history page, served through floter's generic plugin-page
      pipeline. It runs inside a sandboxed iframe in the main window and talks
      to the host exclusively over the postMessage bridge (see
      src/plugins/PluginPageHost.tsx) — no Tauri APIs, and it uses the
      sandboxed bridge for all host communication. The built-in page is allowed
      same-origin only because WebKit otherwise blocks its local stylesheet.
    -->
    <div id="root"></div>
    <script type="module" src="/src/plugins/clipboard/main.ts"></script>
  </body>
</html>
